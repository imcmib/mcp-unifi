name = "mcp-unifi"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["global_fetch_strictly_public"]

# Required before merging/deploying: create a Cloudflare Workers KV namespace,
# then replace the placeholder below with its real namespace ID.
# Never put credentials here: use dashboard Secrets only.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_REAL_KV_NAMESPACE_ID"

[vars]
# This OAuth deployment refuses all MCP access if ENABLE_WRITES is true.
ENABLE_WRITES = "false"
MAX_BATCH = "6"
UPSTREAM_TIMEOUT_MS = "15000"

# Required dashboard Secrets:
#   UNIFI_API_KEY          Site Manager key; never sent to an OAuth client.
#   OWNER_APPROVAL_SECRET  New independent random 32+ byte approval secret.
# Optional:
#   ALLOWED_CONSOLES       Comma separated console IDs.
# Legacy MCP_TOKEN is intentionally not accepted by the OAuth MCP endpoint.
